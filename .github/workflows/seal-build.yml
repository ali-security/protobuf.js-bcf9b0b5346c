name: seal-build
on:
  workflow_dispatch: {}
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '6.9.1'
      - name: Install the publisher npm
        run: npm install -g npm@4.0.5
      - name: Pack the @protobufjs/utf8 tarball
        working-directory: lib/utf8
        run: |
          npm --version
          npm pack
          mv protobufjs-utf8-1.1.0.tgz utf8-1.1.0.tgz
          tar tvzf utf8-1.1.0.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: utf8-tgz
          path: lib/utf8/utf8-1.1.0.tgz
          if-no-files-found: error
